      <text x="10" y="58" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-BHO-101 (S₁)</text>
      <text x="10" y="74" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-BHO-102 (S₂)</text>
      <text x="10" y="90" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-BHO-103 (S₃)</text>
    </g>

    <!-- RAN -->
    <g transform="translate(625, 0)">
      <rect width="115" height="105" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="115" height="22" rx="6" fill="#1e3a8a"/>
      <text x="57" y="15" fill="#ffffff" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">RANCHI [RAN]</text>
      <text x="10" y="40" fill="#dc2626" font-family="Inter, sans-serif" font-size="8" font-weight="bold">AWS-RAN-067 (C)</text>
      <text x="10" y="58" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-RAN-101 (S₁)</text>
      <text x="10" y="74" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-RAN-102 (S₂)</text>
      <text x="10" y="90" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-RAN-103 (S₃)</text>
    </g>

    <!-- VAR -->
    <g transform="translate(750, 0)">
      <rect width="115" height="105" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="115" height="22" rx="6" fill="#1e3a8a"/>
      <text x="57" y="15" fill="#ffffff" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">VARANASI [VAR]</text>
      <text x="10" y="40" fill="#dc2626" font-family="Inter, sans-serif" font-size="8" font-weight="bold">AWS-VAR-052 (C)</text>
      <text x="10" y="58" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-VAR-101 (S₁)</text>
      <text x="10" y="74" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-VAR-102 (S₂)</text>
      <text x="10" y="90" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-VAR-103 (S₃)</text>
