      <text x="10" y="40" fill="#dc2626" font-family="Inter, sans-serif" font-size="8" font-weight="bold">AWS-KOL-015 (C)</text>
      <text x="10" y="58" fill="#334155" font-family="Inter, sans-serif" font-size="7.5">AWS-KOL-101 (S₁)</text>
