      <rect width="115" height="22" rx="6" fill="#1e3a8a"/>
      <text x="57" y="15" fill="#ffffff" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">BHOPAL [BHO]</text>
