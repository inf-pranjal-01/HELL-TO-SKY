<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" width="100%" height="180">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d97706;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="8" />

  <!-- Node 1: Surface AWS Network -->
  <g transform="translate(20, 30)">
    <rect width="180" height="110" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="url(#grad1)"/>
    <text x="90" y="19" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Surface AWS Network</text>
    <text x="90" y="55" fill="#1e293b" font-family="Inter, sans-serif" font-size="9" text-anchor="middle">200+ Urban Nodes</text>
    <text x="90" y="73" fill="#64748b" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">Temp (T), Pressure (P)</text>
    <text x="90" y="91" fill="#64748b" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">Humidity (RH) Telemetry</text>
    <text x="90" y="110" fill="#0284c7" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Sampling: 1-15 min</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="205" y1="85" x2="245" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 2: Raw Telemetry Stream -->
  <g transform="translate(250, 45)">
    <rect width="150" height="80" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="75" y="24" fill="#991b1b" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Raw Sensor Stream</text>
    <text x="75" y="44" fill="#b91c1c" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">• Transient Spikes</text>
    <text x="75" y="59" fill="#b91c1c" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">• Calibration Drift</text>
    <text x="75" y="74" fill="#b91c1c" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">• Frozen Registers</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="405" y1="85" x2="445" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 3: SkyGuard Intelligent QC -->
  <g transform="translate(450, 25)">
    <rect width="200" height="120" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="200" height="28" rx="8" fill="url(#grad1)"/>
    <text x="100" y="19" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">SkyGuard AI Quality Engine</text>
    <text x="100" y="52" fill="#1e3a8a" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">WMO-No. 8 Level I-III Checks</text>
    <text x="100" y="70" fill="#334155" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Tier 0-1 Physical Invariants &amp; LLR</text>
    <text x="100" y="86" fill="#334155" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Tier 2-3 SPRT &amp; 3D Mahalanobis</text>
    <text x="100" y="102" fill="#334155" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">• Tier 4-5 Isolation Forest &amp; Veto</text>
    <text x="100" y="125" fill="#059669" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">Latency: 0.210 ms (p95)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="655" y1="85" x2="695" y2="85" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Node 4: Downstream Operational Consumers -->
  <g transform="translate(700, 30)">
    <rect width="180" height="110" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="url(#grad2)"/>
    <text x="90" y="19" fill="#ffffff" font-family="Inter, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">Validated Consumers</text>
    <text x="90" y="52" fill="#166534" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">1. NWP Data Assimilation</text>
    <text x="90" y="68" fill="#374151" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">(Clean 4D-Var Grids)</text>
    <text x="90" y="86" fill="#166534" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">2. Severe Weather Alerts</text>
    <text x="90" y="102" fill="#166534" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">3. Targeted Maintenance</text>
  </g>
</svg>