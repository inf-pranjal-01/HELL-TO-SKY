<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="240">
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />

  <text x="450" y="24" fill="#0f172a" font-family="Inter, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">49-DIMENSIONAL CONTINUOUS PHYSICAL-TIME FEATURE ARCHITECTURE</text>
  <text x="450" y="40" fill="#64748b" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">Constructed strictly via timestamp alignment (merge_asof) without positional .shift() leakage</text>

  <!-- 10 Feature Group Blocks -->
  <g transform="translate(20, 55)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#1e3a8a"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">01-03: Raw Measured [3]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">T, P, RH (Base Values)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Primary state input</text>
    </g>

    <g transform="translate(175, 0)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#1e3a8a"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">04-06: Residuals [3]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Z-Scores (T, P, RH)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">(x - μ_diurnal) / σ_diurnal</text>
    </g>

    <g transform="translate(350, 0)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#1e3a8a"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">07-12: Rates of Change [6]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Δx/Δt (1-hour &amp; 3-hour)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Physical velocity bounds</text>
    </g>

    <g transform="translate(525, 0)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#1e3a8a"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">13-15: Volatility [3]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Rolling Std Dev (3-hour)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Atmospheric turbulence</text>
    </g>

    <g transform="translate(700, 0)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#1e3a8a"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">16-17: Thermodynamics [2]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Dewpoint Depr &amp; VPD</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Clausius-Clapeyron limits</text>
    </g>

    <!-- Row 2 -->
    <g transform="translate(0, 90)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#0284c7"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">18-21: Cyclical Time [4]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">sin/cos (Hour &amp; DOY)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Diurnal/seasonal phase</text>
    </g>

    <g transform="translate(175, 90)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#0284c7"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">22: Elapsed Time dt [1]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Physical dt_hours</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">(t_k - t_k-1) in hours</text>
    </g>

    <g transform="translate(350, 90)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#0284c7"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">23-28: Robust &amp; Gaps [6]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">IQR Robust Scales (3)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Hours Since Valid (3)</text>
    </g>

    <g transform="translate(525, 90)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#0284c7"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">29-46: Ranges &amp; Slopes [18]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Rolling Ranges (1,3,6,24h)</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Rolling Slopes (6h, 24h)</text>
    </g>

    <g transform="translate(700, 90)">
      <rect width="160" height="75" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <rect width="160" height="20" rx="5" fill="#0284c7"/>
      <text x="80" y="14" fill="#ffffff" font-family="Inter, sans-serif" font-size="8" font-weight="bold" text-anchor="middle">47-49: Diurnal Baselines [3]</text>
      <text x="80" y="38" fill="#334155" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">Same-Hour Residuals</text>
      <text x="80" y="55" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">x_t - Baseline(h_diurnal)</text>
    </g>
  </g>
</svg>