<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="100%" height="380">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#b45309;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#047857;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#475569" />
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" rx="8" />

  <!-- Top: Ingestion & Feature Engineering -->
  <g transform="translate(30, 20)">
    <rect width="840" height="60" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="20" y="24" fill="#0f172a" font-family="Inter, sans-serif" font-size="11" font-weight="bold">INGESTION &amp; TEMPORAL ALIGNMENT LAYER</text>
    <text x="20" y="44" fill="#475569" font-family="Inter, sans-serif" font-size="8.5">REST / WebSocket Input → merge_asof Continuous Physical Time Alignment → 49-Dimensional Multi-Scale Feature Matrix</text>
  </g>

  <!-- Arrow down to Hierarchy -->
  <line x1="450" y1="80" x2="450" y2="105" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />

  <!-- Center Box: Deterministic Tier 0-5 Priority Hierarchy -->
  <g transform="translate(30, 110)">
    <rect width="840" height="150" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <rect width="840" height="26" rx="8" fill="url(#blueGrad)"/>
    <text x="420" y="18" fill="#ffffff" font-family="Inter, sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">DETERMINISTIC TIER 0–5 PRIORITY ARBITRATION HIERARCHY (model/detect.py)</text>

    <!-- 5 Tier Boxes inside -->
    <g transform="translate(15, 38)">
      <!-- Tier 0 -->
      <rect x="0" y="0" width="150" height="95" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="0" y="0" width="150" height="20" rx="5" fill="#fee2e2"/>
      <text x="75" y="14" fill="#991b1b" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">TIER 0: Invariants &amp; Rails</text>
      <text x="75" y="38" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Ground Sentinels (0.0V)</text>
      <text x="75" y="52" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Physical Limits (-40..60°C)</text>
      <text x="75" y="70" fill="#b91c1c" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Bypasses ML Layers</text>
      <text x="75" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Confidence: 100.0%</text>

      <!-- Tier 1 -->
      <rect x="165" y="0" width="150" height="95" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="165" y="0" width="150" height="20" rx="5" fill="#ffedd5"/>
      <text x="240" y="14" fill="#9a3412" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">TIER 1: Specialist LLR</text>
      <text x="240" y="38" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Spike LLR &gt; 5.0σ</text>
      <text x="240" y="52" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Frozen F-Ratio Collapse</text>
      <text x="240" y="70" fill="#c2410c" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Dynamic Step Tests</text>
      <text x="240" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Recall: 100% / 97.4%</text>

      <!-- Tier 2 -->
      <rect x="330" y="0" width="150" height="95" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="330" y="0" width="150" height="20" rx="5" fill="#fef9c3"/>
      <text x="405" y="14" fill="#854d0e" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">TIER 2: SPRT Drift</text>
      <text x="405" y="38" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Sequential Change (CUSUM)</text>
      <text x="405" y="52" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Low-SNR Innovation Sum</text>
      <text x="405" y="70" fill="#a16207" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Pre-Whitened Residuals</text>
      <text x="405" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Recall: 91.9%</text>

      <!-- Tier 3 -->
      <rect x="495" y="0" width="150" height="95" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="495" y="0" width="150" height="20" rx="5" fill="#e0e7ff"/>
      <text x="570" y="14" fill="#3730a3" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">TIER 3: Mahalanobis D²</text>
      <text x="570" y="38" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• 3D Covariance Vector</text>
      <text x="570" y="52" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Clausius-Clapeyron VPD</text>
      <text x="570" y="70" fill="#4338ca" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">p &lt; 10⁻³ Threshold</text>
      <text x="570" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Recall: 100.0%</text>

      <!-- Tier 4-5 -->
      <rect x="660" y="0" width="150" height="95" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
      <rect x="660" y="0" width="150" height="20" rx="5" fill="#dcfce7"/>
      <text x="735" y="14" fill="#166534" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">TIER 4-5: IF &amp; Veto</text>
      <text x="735" y="38" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• Isolation Forest Tail Score</text>
      <text x="735" y="52" fill="#1e293b" font-family="Inter, sans-serif" font-size="7.5" text-anchor="middle">• 3-Peer Spatial Consensus</text>
      <text x="735" y="70" fill="#15803d" font-family="Inter, sans-serif" font-size="7.5" font-weight="bold" text-anchor="middle">Vetoes Severe Weather</text>
      <text x="735" y="85" fill="#64748b" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Mean Prec: 72.35%</text>
    </g>
  </g>

  <!-- Arrow down to State & Explainer -->
  <line x1="450" y1="260" x2="450" y2="285" stroke="#475569" stroke-width="2" marker-end="url(#arr)" />

  <!-- Bottom: State Management & Explainability -->
  <g transform="translate(30, 290)">
    <rect width="405" height="70" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="20" y="24" fill="#166534" font-family="Inter, sans-serif" font-size="10" font-weight="bold">CAUSAL STATE MANAGEMENT (model/state.py)</text>
    <text x="20" y="44" fill="#14532d" font-family="Inter, sans-serif" font-size="8">• FAULT Readings → Quarantined (Excluded from StationBuffer)</text>
    <text x="20" y="58" fill="#14532d" font-family="Inter, sans-serif" font-size="8">• NORMAL Readings → Assimilated into Rolling Baseline Deques</text>
  </g>

  <g transform="translate(465, 290)">
    <rect width="405" height="70" rx="6" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text x="20" y="24" fill="#5b21b6" font-family="Inter, sans-serif" font-size="10" font-weight="bold">EXPLAINABILITY &amp; AUDIT DISPATCH (model/explain.py)</text>
    <text x="20" y="44" fill="#4c1d95" font-family="Inter, sans-serif" font-size="8">• TreeExplainer SHAP Local Feature Attribution Breakdown</text>
    <text x="20" y="58" fill="#4c1d95" font-family="Inter, sans-serif" font-size="8">• Real-Time WebSocket Streaming &amp; CSV Audit Storage</text>
  </g>
</svg>