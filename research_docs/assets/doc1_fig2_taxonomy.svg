<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="200">
  <rect width="100%" height="100%" fill="#ffffff" rx="8" />

  <!-- Root -->
  <g transform="translate(15, 75)">
    <rect width="150" height="50" rx="6" fill="#1e3a8a" stroke="#0f172a" stroke-width="1"/>
    <text x="75" y="24" fill="#ffffff" font-family="Inter, sans-serif" font-size="10" font-weight="bold" text-anchor="middle">AWS Telemetry</text>
    <text x="75" y="39" fill="#93c5fd" font-family="Inter, sans-serif" font-size="8.5" text-anchor="middle">Failure Taxonomy</text>
  </g>

  <!-- Connectors -->
  <path d="M 165 100 L 210 100" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  <path d="M 210 30 L 210 170" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <line x1="210" y1="30" x2="240" y2="30" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="210" y1="75" x2="240" y2="75" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="210" y1="125" x2="240" y2="125" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="210" y1="170" x2="240" y2="170" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Category 1: Transient Spikes -->
  <g transform="translate(240, 10)">
    <rect width="640" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="130" height="38" rx="5" fill="#fee2e2"/>
    <text x="65" y="23" fill="#991b1b" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Instantaneous Spikes</text>
    <text x="145" y="16" fill="#1e293b" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Mechanism: EMI, voltage transients, cellular packet bit-flips</text>
    <text x="145" y="30" fill="#475569" font-family="Inter, sans-serif" font-size="7.5">Impact: Triggers false threshold alerts. Detected via: Tier 1 Dynamic Jump LLR (&gt;5σ).</text>
  </g>

  <!-- Category 2: Frozen / Stuck Sensors -->
  <g transform="translate(240, 56)">
    <rect width="640" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="130" height="38" rx="5" fill="#fef3c7"/>
    <text x="65" y="23" fill="#92400e" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Variance Collapse</text>
    <text x="145" y="16" fill="#1e293b" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Mechanism: Mechanical jamming, spider webs in barometer port, ADC lockup</text>
    <text x="145" y="30" fill="#475569" font-family="Inter, sans-serif" font-size="7.5">Impact: Blinds NWP models during real storms. Detected via: Tier 1 F-Ratio Variance Collapse.</text>
  </g>

  <!-- Category 3: Low-SNR Drift -->
  <g transform="translate(240, 106)">
    <rect width="640" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="130" height="38" rx="5" fill="#e0e7ff"/>
    <text x="65" y="23" fill="#3730a3" font-family="Inter, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">Calibration Drift</text>
    <text x="145" y="16" fill="#1e293b" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Mechanism: Polymer aging, chemical fouling, thermal expansion bias (+0.05°C/hr)</text>
    <text x="145" y="30" fill="#475569" font-family="Inter, sans-serif" font-size="7.5">Impact: Corrupts long-term climate baselines. Detected via: Tier 2 Pre-Whitened SPRT / CUSUM.</text>
  </g>

  <!-- Category 4: Thermodynamic Inconsistency -->
  <g transform="translate(240, 152)">
    <rect width="640" height="38" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <rect width="130" height="38" rx="5" fill="#ede9fe"/>
    <text x="65" y="23" fill="#5b21b6" font-family="Inter, sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">Thermodynamic Error</text>
    <text x="145" y="16" fill="#1e293b" font-family="Inter, sans-serif" font-size="8" font-weight="bold">Mechanism: Single-channel transducer failure creating psychrometric paradox (T vs RH)</text>
    <text x="145" y="30" fill="#475569" font-family="Inter, sans-serif" font-size="7.5">Impact: Destabilizes moisture gradient calculations. Detected via: Tier 3 3D Mahalanobis (D²).</text>
  </g>
</svg>